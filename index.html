<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="referrer" content="no-referrer">
  <title>MEG MUSIC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d4ff00'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' fill='%23000'%3E音%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1 class="brand"><span class="jp">音楽</span><span id="brand">MEG MUSIC</span></h1>
      <form id="searchForm" class="search" autocomplete="off">
        <input id="q" type="search" placeholder="Cari lagu / artis, atau tempel link Spotify…" aria-label="Cari lagu" enterkeyhint="search" autocapitalize="off" spellcheck="false">
        <button type="submit">CARI</button>
      </form>
      <nav id="tabs" class="tabs">
        <button type="button" data-tab="results" class="active">Hasil</button>
        <button type="button" data-tab="favorites">Favorit</button>
        <button type="button" data-tab="recent">Terakhir</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <p id="status" class="status"></p>
    <ul id="list" class="list"></ul>
  </main>

  <footer id="player" class="player" hidden>
    <div class="p-info">
      <div class="cover"><img id="pCover" alt=""></div>
      <div class="meta">
        <div id="pTitle" class="t">—</div>
        <div id="pArtist" class="a">—</div>
      </div>
    </div>
    <div class="p-center">
      <div class="p-seek">
        <span id="cur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Posisi lagu">
        <span id="dur">0:00</span>
      </div>
      <div class="p-ctrl">
        <button type="button" id="btnShuffle" class="sm" aria-label="Acak">⇄</button>
        <button type="button" id="btnPrev" aria-label="Sebelumnya"></button>
        <button type="button" id="btnPlay" class="main" aria-label="Putar atau jeda"></button>
        <button type="button" id="btnNext" aria-label="Berikutnya"></button>
        <button type="button" id="btnRepeat" class="sm" aria-label="Ulangi">↻</button>
      </div>
    </div>
    <div class="p-vol">
      <span>VOL</span>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
    </div>
  </footer>

  <div id="toast" class="toast" role="status"></div>
  <audio id="audio" preload="none"></audio>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
